<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Parent Portal - Assalam Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/assets/css/style.css" />

<style>
:root {
  --navy: #0f4c81;
  --navy-2: #136fb1;
  --ink: #14213d;
  --maroon: #8b1d3f;
  --green: #2e8b6f;
  --paper: #f4f6fb;
  --card: #ffffff;
  --card-2: #f7fafd;
  --text: #1f2937;
  --muted: #64748b;
  --line: rgba(15,76,129,.12);
  --shadow: 0 24px 60px -20px rgba(15,76,129,.35);
  --shadow-sm: 0 8px 24px -12px rgba(15,76,129,.30);
  --grid: rgba(15,76,129,.05);
}
html.dark {
  --navy: #4f9dd8;
  --navy-2: #6db3e8;
  --ink: #e8eefc;
  --maroon: #e78aa5;
  --green: #4fc6a1;
  --paper: #060b18;
  --card: #0d1526;
  --card-2: #111c31;
  --text: #dbe4f3;
  --muted: #8494ad;
  --line: rgba(120,170,220,.14);
  --shadow: 0 24px 70px -20px rgba(0,0,0,.75);
  --shadow-sm: 0 10px 30px -14px rgba(0,0,0,.7);
  --grid: rgba(120,170,220,.05);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text);
  background: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
  min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition: background-color .4s ease, color .4s ease;
}

/* HEADER */
.school-header {
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  color: #fff;
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 6px 20px -6px rgba(0,0,0,.4);
}
.school-header .crest {
  width: 48px; height: 48px;
  flex: none;
  border-radius: 12px;
  background: rgba(255,255,255,.16);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.school-header .crest img { width: 76%; height: 76%; object-fit: contain; }
.school-header .titles { min-width: 0; }
.school-header h1 {
  font-family: 'Fraunces', serif;
  font-size: 1.15rem;
  margin: 0;
  font-weight: 700;
  line-height: 1.15;
}
.school-header p {
  margin: 2px 0 0;
  font-size: .8rem;
  color: rgba(255,255,255,.82);
  font-weight: 500;
  letter-spacing: .03em;
  text-transform: uppercase;
}
.theme-toggle {
  margin-left: auto;
  flex: none;
  width: 42px; height: 42px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.12);
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .2s;
}
.theme-toggle:hover { background: rgba(255,255,255,.22); transform: translateY(-2px); }
.theme-toggle svg { width: 20px; height: 20px; }

/* MAIN WRAPPER */
.container {
  max-width: 850px;
  margin: 1.4rem auto;
  padding: 0 18px;
  animation: fadeIn .7s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.page-title { text-align: center; margin: 1.4rem 0 1.6rem; }
.page-title .eyebrow {
  display: inline-block;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--maroon);
  background: color-mix(in srgb, var(--maroon) 10%, transparent);
  padding: 6px 14px;
  border-radius: 999px;
  margin-bottom: 12px;
}
.page-title h2 {
  margin: 0;
  font-family: 'Fraunces', serif;
  color: var(--ink);
  font-weight: 700;
  font-size: clamp(1.5rem, 4.5vw, 2.1rem);
}

/* CARDS */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card-2);
  padding: 14px 18px;
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 1.05rem;
  border-bottom: 1px solid var(--line);
  color: var(--navy);
}
.card-header::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--navy);
  flex: none;
}
.card-body { padding: 16px 18px; }

.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 1rem;
  margin-bottom: .7rem;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: transform .25s, box-shadow .25s, border-color .25s;
}
.list-item:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
  border-color: var(--navy);
}

/* BUTTONS */
button.primary {
  width: 100%;
  padding: .78rem;
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  color: #fff;
  font-family: inherit;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1rem;
  touch-action: manipulation;
  box-shadow: 0 10px 22px -10px rgba(15,76,129,.6);
  transition: transform .22s, box-shadow .22s, opacity .2s;
}
button.primary:hover { transform: translateY(-2px); box-shadow: 0 16px 28px -12px rgba(15,76,129,.7); }
button.primary:active { transform: scale(.96); opacity: .9; }

/* INPUTS */
input {
  width: 100%;
  padding: .78rem .85rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-family: inherit;
  font-size: 1rem;
  margin-bottom: .9rem;
  background: var(--card-2);
  color: var(--text);
  touch-action: manipulation;
  transition: border-color .22s, box-shadow .22s;
}
input::placeholder { color: var(--muted); }
input:focus {
  border-color: var(--navy);
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy) 20%, transparent);
}

/* STATUS TEXT */
#authStatus, #verifyStatus { margin-top: 10px; font-weight: 600; font-size: .9rem; color: var(--muted); }

/* MOBILE */
@media (max-width: 480px) {
  .school-header h1 { font-size: 1rem; }
  .container { padding: 0 14px; margin-top: .7rem; }
  button.primary, input { font-size: .95rem; }
  .list-item { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, #broadcast-overlay { animation: none !important; transition: none !important; }
}

.site-footer {
  margin: 2.4rem 0 1.6rem;
  text-align: center;
  font-size: .85rem;
  color: var(--muted);
  padding: 10px;
}
.site-footer strong { color: var(--text); font-weight: 600; }
</style>
</head>

<body>

<header class="school-header">
  <span class="crest"><img src="/public/logo.png" class="school-logo" alt="School logo"></span>
  <div class="titles">
    <h1 id="schoolName">Assalam International Academic School Garko</h1>
    <p>Parent Portal — Access Child Exams &amp; Tests</p>
  </div>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
    <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="container">

  <div class="page-title">
    <span class="eyebrow">Guardian Access</span>
    <h2>Parent Portal</h2>
  </div>

  <!-- Login -->
  <div class="card" id="authCard">
    <div class="card-header">Parent Login</div>
    <div class="card-body">
      <form id="authFormParent">
        <input id="portalPassword" placeholder="Parent Access Password" required>
        <button class="primary" type="submit">Login</button>
        <div id="authStatus"></div>
      </form>
    </div>
  </div>

  <!-- Student -->
  <div class="card" id="studentCard" style="display:none;">
    <div class="card-header">Enter Student ID</div>
    <div class="card-body">
      <input id="studentIdInput" placeholder="Enter Student ID" required>
      <button class="primary" id="verifyBtn">Verify Student</button>
      <div id="verifyStatus"></div>
    </div>
  </div>

  <!-- Reports -->
  <div class="card" id="reportArea" style="display:none;">
    <div class="card-header">Student Reports</div>
    <div class="card-body" id="reportList"></div>
  </div>
</div>

<script>
/* ===== Theme toggle ===== */
(function () {
  const root = document.documentElement;
  let dark = false;
  try { dark = localStorage.getItem('theme') === 'dark'; } catch (e) {}
  if (!localStorage.getItem('theme')) {
    dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function apply() {
    root.classList.toggle('dark', dark);
    const sun = document.getElementById('iconSun');
    const moon = document.getElementById('iconMoon');
    if (sun && moon) { sun.style.display = dark ? 'none' : 'block'; moon.style.display = dark ? 'block' : 'none'; }
  }
  apply();
  const btn = document.getElementById('themeToggle');
  if (btn) btn.addEventListener('click', function () {
    dark = !dark;
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    apply();
  });
})();
</script>

<script src="/branding.js"></script>
<script src="/broadcast.js"></script>


<script src="/public/assets/js/parent.js"></script>
<footer class="site-footer">
  © 2026 <strong>SUIBING IT SERVICES</strong>. All Rights Reserved.
</footer>

</body>
</html>
