<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Class Attendance - Assalam Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
:root {
  --navy: #0f4c81;
  --navy-2: #136fb1;
  --ink: #14213d;
  --maroon: #8b1d3f;
  --green: #2e8b6f;
  --danger: #dc3545;
  --paper: #f4f6fb;
  --card: #ffffff;
  --card-2: #f7fafd;
  --text: #1f2937;
  --muted: #64748b;
  --line: rgba(15,76,129,.12);
  --shadow: 0 24px 60px -20px rgba(15,76,129,.35);
  --shadow-sm: 0 8px 24px -12px rgba(15,76,129,.30);
  --grid: rgba(15,76,129,.05);
}
html.dark {
  --navy: #4f9dd8;
  --navy-2: #6db3e8;
  --ink: #e8eefc;
  --maroon: #e78aa5;
  --green: #4fc6a1;
  --danger: #f0736f;
  --paper: #060b18;
  --card: #0d1526;
  --card-2: #111c31;
  --text: #dbe4f3;
  --muted: #8494ad;
  --line: rgba(120,170,220,.14);
  --shadow: 0 24px 70px -20px rgba(0,0,0,.75);
  --shadow-sm: 0 10px 30px -14px rgba(0,0,0,.7);
  --grid: rgba(120,170,220,.05);
}

* {
  box-sizing: border-box;
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
  color: var(--text);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition: background-color .4s ease, color .4s ease;
}

header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  color: #fff;
  padding: 16px;
  font-family: 'Fraunces', serif;
  font-size: 19px;
  font-weight: 700;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 6px 20px -6px rgba(0,0,0,.4);
}
header .theme-toggle {
  position: absolute;
  right: 14px;
  width: 40px; height: 40px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.12);
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .2s;
}
header .theme-toggle:hover { background: rgba(255,255,255,.22); transform: translateY(-2px); }
header .theme-toggle svg { width: 20px; height: 20px; }

.container {
  max-width: 520px;
  margin: 1.4rem auto;
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-sm);
  animation: rise .5s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

h3 {
  margin-top: 0;
  margin-bottom: 1.2rem;
  text-align: center;
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--ink);
}

label { font-size: 14px; font-weight: 600; color: var(--text); }

input, select, button {
  width: 100%;
  padding: 13px 14px;
  margin: 8px 0;
  font-family: inherit;
  font-size: 16px;
  border-radius: 11px;
  border: 1px solid var(--line);
}

input, select {
  background: var(--card-2);
  color: var(--text);
  transition: border-color .22s, box-shadow .22s;
}
input::placeholder { color: var(--muted); }
input:focus, select:focus {
  border-color: var(--navy);
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy) 20%, transparent);
}

button {
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  color: #fff;
  border: none;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 10px 22px -12px rgba(15,76,129,.6);
  transition: transform .2s, filter .2s, opacity .2s;
}
button:hover { transform: translateY(-2px); filter: brightness(1.05); }
button:active { transform: scale(.97); opacity: .92; }

button.secondary { background: linear-gradient(135deg, var(--green), #1f6f57); }
.logout { background: linear-gradient(135deg, var(--danger), #b02a37); margin-top: 10px; }

.hint { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }

.student {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card-2);
  border: 1px solid var(--line);
  padding: 13px 14px;
  margin-bottom: 8px;
  border-radius: 11px;
  transition: border-color .2s, transform .2s;
}
.student:hover { border-color: var(--navy); transform: translateX(2px); }
.student span { font-size: 15px; color: var(--text); }
.student input {
  width: auto;
  margin: 0;
  transform: scale(1.4);
  accent-color: var(--green);
}

.success {
  display: none;
  text-align: center;
  color: var(--green);
  font-weight: 700;
  margin-top: 16px;
}

.hidden { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, #broadcast-overlay { animation: none !important; transition: none !important; }
}
  </style>
</head>

<body>
<header>
  Class Attendance
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
    <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<!-- TEACHER LOGIN -->
<div class="container" id="teacherLogin">
  <h3>Teacher Login</h3>

  <input type="text" id="teacherId" placeholder="Teacher ID" />
  <input type="password" id="teacherPassword" placeholder="Password" />

  <button onclick="loginTeacher()">Login</button>

  <p class="hint">
    Enter your official teacher credentials to access the attendance panel.
  </p>
</div>


<!-- ATTENDANCE PANEL -->
<div class="container hidden" id="attendancePanel" style="display:none;">

  <h3>Mark Attendance</h3>

  <!-- Step 1 -->
  <label>Step 1: Select Class</label>
  <select id="classSelect"></select>

  <!-- Step 2 -->
  <button onclick="loadStudents()">Load Students</button>

  <label style="margin-top:12px; display:block;">
    Step 2: Enter Class Password (needed when you submit, not before)
  </label>
  <input type="password" id="classPassword" placeholder="Class Password" />

  <p class="hint">
    Students load as soon as you select a class — the class password is only checked
    when you actually submit attendance.

  </p>

  <hr />

  <!-- Students -->
  <div id="studentList"></div>

  <!-- Submit -->
  <button class="secondary" onclick="submitAttendance()">
    Submit Attendance
  </button>

  <button class="logout" onclick="logoutTeacher()">
    Logout
  </button>

  <div id="successMsg" class="success" style="display:none;">
    Attendance Submitted Successfully
  </div>

</div>

<script>
/* ===== Theme toggle ===== */
(function () {
  const root = document.documentElement;
  let dark = false;
  try { dark = localStorage.getItem('theme') === 'dark'; } catch (e) {}
  if (!localStorage.getItem('theme')) {
    dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function apply() {
    root.classList.toggle('dark', dark);
    const sun = document.getElementById('iconSun');
    const moon = document.getElementById('iconMoon');
    if (sun && moon) { sun.style.display = dark ? 'none' : 'block'; moon.style.display = dark ? 'block' : 'none'; }
  }
  apply();
  const btn = document.getElementById('themeToggle');
  if (btn) btn.addEventListener('click', function () {
    dark = !dark;
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    apply();
  });
})();
</script>

<script src="/branding.js"></script>
<script src="/broadcast.js"></script>
<script src="attendance.js"></script>
</body>
</html>
