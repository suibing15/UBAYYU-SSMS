<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>System Access - Assalam Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0f4c81;
  --navy-2: #136fb1;
  --ink: #14213d;
  --maroon: #8b1d3f;
  --green: #2e8b6f;
  --danger: #c0392b;
  --paper: #eef2f8;
  --card: #ffffff;
  --card-2: #f7fafd;
  --text: #1f2937;
  --muted: #64748b;
  --line: rgba(15,76,129,.14);
  --shadow: 0 30px 70px -24px rgba(10,30,60,.55);
  --grid: rgba(15,76,129,.06);
  --lock-ring: rgba(15,76,129,.14);
}
html.dark {
  --navy: #4f9dd8;
  --navy-2: #6db3e8;
  --ink: #e8eefc;
  --maroon: #e78aa5;
  --green: #4fc6a1;
  --danger: #f0736f;
  --paper: #04070f;
  --card: #0d1526;
  --card-2: #111c31;
  --text: #dbe4f3;
  --muted: #8494ad;
  --line: rgba(120,170,220,.16);
  --shadow: 0 30px 80px -24px rgba(0,0,0,.85);
  --grid: rgba(120,170,220,.06);
  --lock-ring: rgba(120,170,220,.16);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(1100px 600px at 50% -10%, color-mix(in srgb, var(--navy) 22%, transparent), transparent 70%),
    var(--paper);
  background-image:
    radial-gradient(1100px 600px at 50% -10%, color-mix(in srgb, var(--navy) 22%, transparent), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: auto, 44px 44px, 44px 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px env(safe-area-inset-right) 24px env(safe-area-inset-left);
  transition: background-color .4s ease, color .4s ease;
}

.theme-toggle {
  position: fixed;
  top: 18px; right: 18px;
  width: 42px; height: 42px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px -14px rgba(10,30,60,.5);
  transition: transform .2s, background .2s;
  z-index: 10;
}
.theme-toggle:hover { transform: translateY(-2px); }
.theme-toggle svg { width: 20px; height: 20px; }

.card {
  width: 100%;
  max-width: 360px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 34px 28px 28px;
  box-shadow: var(--shadow);
  text-align: center;
  animation: rise .5s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

.lock {
  width: 66px; height: 66px;
  margin: 0 auto 18px;
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--navy) 12%, transparent);
  color: var(--navy);
  box-shadow: 0 0 0 6px var(--lock-ring);
}
.lock svg { width: 30px; height: 30px; }

.eyebrow {
  display: inline-block;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--maroon);
  background: color-mix(in srgb, var(--maroon) 10%, transparent);
  padding: 6px 14px;
  border-radius: 999px;
  margin-bottom: 14px;
}
h2 {
  margin: 0 0 6px;
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--ink);
}
.sub { margin: 0 0 20px; font-size: .88rem; color: var(--muted); }

input {
  width: 100%;
  padding: 13px 14px;
  font-family: inherit;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card-2);
  color: var(--text);
  text-align: center;
  letter-spacing: .1em;
  transition: border-color .22s, box-shadow .22s;
}
input::placeholder { color: var(--muted); letter-spacing: normal; }
input:focus {
  outline: none;
  border-color: var(--navy);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy) 20%, transparent);
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 14px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 12px 24px -12px rgba(15,76,129,.6);
  transition: transform .2s, box-shadow .2s, filter .2s;
}
button:hover { transform: translateY(-2px); filter: brightness(1.05); }
button:active { transform: scale(.98); }

#msg { margin-top: 14px; font-size: 14px; font-weight: 600; min-height: 18px; color: var(--muted); }

.foot { margin-top: 20px; font-size: .74rem; color: var(--muted); letter-spacing: .02em; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

  <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
    <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <div class="card">
    <div class="lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.3"/>
      </svg>
    </div>
    <span class="eyebrow">Restricted</span>
    <h2>System Access</h2>
    <p class="sub">Enter your access key to continue to the management console.</p>

    <input id="key" type="password" placeholder="Access key" autofocus
           onkeydown="if(event.key==='Enter') unlock()" />
    <button onclick="unlock()">Unlock</button>
    <div id="msg"></div>

    <div class="foot">Assalam International Academic School Garko</div>
  </div>

<script>
/* ===== Theme toggle ===== */
(function () {
  const root = document.documentElement;
  let dark = false;
  try { dark = localStorage.getItem('theme') === 'dark'; } catch (e) {}
  if (!localStorage.getItem('theme')) {
    dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function apply() {
    root.classList.toggle('dark', dark);
    const sun = document.getElementById('iconSun');
    const moon = document.getElementById('iconMoon');
    if (sun && moon) { sun.style.display = dark ? 'none' : 'block'; moon.style.display = dark ? 'block' : 'none'; }
  }
  apply();
  const btn = document.getElementById('themeToggle');
  if (btn) btn.addEventListener('click', function () {
    dark = !dark;
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    apply();
  });
})();

/* ===== Unlock ===== */
async function unlock() {
  const key = document.getElementById('key').value.trim();
  const msg = document.getElementById('msg');
  msg.style.color = 'var(--muted)';
  msg.textContent = 'Checking...';
  try {
    const r = await fetch('/api/manage-unlock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key })
    });
    if (r.ok) {
      msg.style.color = 'var(--green)';
      msg.textContent = 'Access granted';
      setTimeout(() => location.href = '/manage', 600);
    } else {
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Invalid key';
    }
  } catch (e) {
    msg.style.color = 'var(--danger)';
    msg.textContent = 'Network error';
  }
}
</script>
</body>
</html>
